# LumVorax Kubernetes Deployment
# Production-ready configuration with HA and auto-scaling
# Version: 1.0.0

---
apiVersion: v1
kind: Namespace
metadata:
  name: lumvorax
  labels:
    name: lumvorax
    environment: production

---
# ConfigMap for LumVorax configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumvorax-config
  namespace: lumvorax
data:
  lumvorax.conf: |
    # LumVorax Configuration
    [core]
    log_level = INFO
    num_workers = 4
    cache_size = 1000
    
    [network]
    p2p_port = 9000
    api_port = 8080
    metrics_port = 8081
    
    [database]
    replication_mode = semi-synchronous
    max_connections = 100
    
    [consensus]
    raft_election_timeout_ms = 150
    raft_heartbeat_interval_ms = 50

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: lumvorax-secrets
  namespace: lumvorax
type: Opaque
stringData:
  db-password: "changeme"
  api-key: "your-api-key-here"

---
# PersistentVolumeClaim for data storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lumvorax-data-pvc
  namespace: lumvorax
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
# Service for LumVorax API
apiVersion: v1
kind: Service
metadata:
  name: lumvorax-api
  namespace: lumvorax
  labels:
    app: lumvorax
    component: api
spec:
  type: LoadBalancer
  selector:
    app: lumvorax
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 8081
      targetPort: 8081
      protocol: TCP

---
# Service for P2P Network (Headless)
apiVersion: v1
kind: Service
metadata:
  name: lumvorax-p2p
  namespace: lumvorax
  labels:
    app: lumvorax
    component: p2p
spec:
  clusterIP: None  # Headless service for P2P discovery
  selector:
    app: lumvorax
  ports:
    - name: p2p
      port: 9000
      targetPort: 9000
      protocol: TCP

---
# StatefulSet for LumVorax (for stable network identity)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lumvorax
  namespace: lumvorax
  labels:
    app: lumvorax
spec:
  serviceName: lumvorax-p2p
  replicas: 3  # 3 nodes for Raft consensus
  selector:
    matchLabels:
      app: lumvorax
  template:
    metadata:
      labels:
        app: lumvorax
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        # Spread pods across different nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - lumvorax
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: lumvorax
          image: lumvorax/lumvorax:1.0.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
            - name: p2p
              containerPort: 9000
              protocol: TCP
          
          env:
            - name: LUMVORAX_HOME
              value: "/var/lib/lumvorax"
            - name: LUMVORAX_CONFIG
              value: "/etc/lumvorax/lumvorax.conf"
            - name: LUMVORAX_LOG_LEVEL
              value: "INFO"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          volumeMounts:
            - name: config
              mountPath: /etc/lumvorax
            - name: data
              mountPath: /var/lib/lumvorax/data
            - name: logs
              mountPath: /var/lib/lumvorax/logs
          
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /startup
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      
      volumes:
        - name: config
          configMap:
            name: lumvorax-config
        - name: logs
          emptyDir: {}
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi

---
# HorizontalPodAutoscaler for auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumvorax-hpa
  namespace: lumvorax
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: lumvorax
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lumvorax-pdb
  namespace: lumvorax
spec:
  minAvailable: 2  # Always keep at least 2 pods running
  selector:
    matchLabels:
      app: lumvorax

---
# NetworkPolicy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lumvorax-netpol
  namespace: lumvorax
spec:
  podSelector:
    matchLabels:
      app: lumvorax
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 9000
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow to same namespace
    - to:
        - podSelector: {}
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow external (for P2P)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9000

