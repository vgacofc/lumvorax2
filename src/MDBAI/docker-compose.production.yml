version: '3.8'

services:
  # Redis pour le cache et les sessions
  redis:
    image: redis:7-alpine
    container_name: mdbai-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - mdbai-network

  # Instance MDBAI 1
  mdbai-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mdbai-api-1
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=api-1
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mdbai-network

  # Instance MDBAI 2
  mdbai-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mdbai-api-2
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=api-2
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mdbai-network

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: mdbai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - mdbai-api-1
      - mdbai-api-2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mdbai-network

  # Watchtower pour auto-updates
  watchtower:
    image: containrrr/watchtower
    container_name: mdbai-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_REVIVE_STOPPED=false
    networks:
      - mdbai-network

volumes:
  redis-data:
    driver: local
  nginx-cache:
    driver: local

networks:
  mdbai-network:
    driver: bridge

